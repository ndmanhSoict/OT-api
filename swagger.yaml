openapi: 3.0.3
info:
  title: SHTT API - Quản lý Sở hữu Trí tuệ
  description: |
    API quản lý Sở hữu Trí tuệ gồm: Bản quyền tác giả, Nhãn hiệu, Sáng chế,
    Kiểu dáng công nghiệp, Chỉ dẫn địa lý, Làng nghề truyền thống.

    ## Xác thực
    Sử dụng **JWT Bearer Token**. Đăng nhập qua `/api/auth/login` để lấy `accessToken`,
    sau đó nhấn nút **Authorize** và nhập `Bearer <token>`.

    ## Phân quyền
    | Nhóm endpoint | Quyền yêu cầu |
    |---|---|
    | GET /search, GET /, GET /:id | Công khai |
    | GET /search-all | Admin hoặc Staff |
    | POST / PUT / DELETE (IP resources) | Admin hoặc Staff |
    | Mọi thao tác /api/users | Chỉ Admin |

    ## Upload ảnh
    Các endpoint POST/PUT sử dụng `multipart/form-data`.
    Trường `owner`, `authors`, `managementOrg` truyền dưới dạng **JSON string** trong form.

    ## Lưu ý mã lỗi xác thực
    - `401` — Thiếu token (không có header Authorization)
    - `403` — Token không hợp lệ / hết hạn, hoặc không đủ quyền (sai role)
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local Development

tags:
  - name: Health
    description: Kiểm tra hệ thống
  - name: Auth
    description: Đăng nhập & làm mới token
  - name: Users
    description: Quản lý tài khoản (Admin only)
  - name: Stakeholders
    description: Quản lý Chủ thể (tác giả, chủ sở hữu, tổ chức)
  - name: Copyrights
    description: Bản quyền tác giả
  - name: Craft Villages
    description: Làng nghề truyền thống
  - name: Trademarks
    description: Nhãn hiệu
  - name: Geographical Indications
    description: Chỉ dẫn địa lý
  - name: Inventions
    description: Sáng chế / Giải pháp hữu ích
  - name: Industrial Designs
    description: Kiểu dáng công nghiệp

# ─────────────────────────────────────────────
# COMPONENTS
# ─────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Access Token lấy từ POST /api/auth/login

  schemas:

    # ── Chung ──────────────────────────────────
    SuccessMessage:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Thao tác thành công

    SuccessWithId:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        id:
          type: integer
          format: int64
          example: 1714200000000

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Lỗi server
        error:
          type: string
          example: Error detail

    # ── Stakeholder ─────────────────────────────
    StakeholderBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: Nguyễn Văn A
        address:
          type: string
          example: 123 Lê Lợi, Hà Nội

    StakeholderObject:
      allOf:
        - $ref: '#/components/schemas/StakeholderBody'
        - type: object
          properties:
            id:
              type: integer
              format: int64
              example: 1714200000001

    StakeholderListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/StakeholderObject'

    StakeholderDetailResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/StakeholderObject'

    # ── User ────────────────────────────────────
    UserObject:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1714100000000
        username:
          type: string
          example: admin
        fullName:
          type: string
          example: Quản trị viên
        role:
          type: string
          enum: [admin, staff]
          example: admin

    # ── User login response (không có fullName) ──
    UserLoginObject:
      type: object
      description: Thông tin user trả về sau khi đăng nhập (không bao gồm fullName)
      properties:
        id:
          type: integer
          format: int64
          example: 1714100000000
        username:
          type: string
          example: admin
        role:
          type: string
          enum: [admin, staff]
          example: admin

    # ── Copyright ───────────────────────────────
    CopyrightStakeholder:
      type: object
      description: |
        Stakeholder trong chi tiết bản quyền. Lưu ý: trường `role` (author/owner) được
        trả về từ bảng liên kết, không có trường `id`.
      properties:
        name:
          type: string
          example: Nguyễn Văn A
        address:
          type: string
          example: 123 Lê Lợi, Hà Nội
        role:
          type: string
          enum: [author, owner]
          example: author

    CopyrightDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        certificateNumber:
          type: string
          example: BQ-2024-001
        grantDate:
          type: string
          format: date
          example: "2024-01-15"
        title:
          type: string
          example: Phần mềm quản lý nhà hàng
        type:
          type: string
          example: software
        imageUrls:
          type: string
          description: JSON array lưu đường dẫn ảnh
          example: '["/uploads/img1.jpg"]'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/CopyrightStakeholder'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/CopyrightStakeholder'

    # ── Craft Village ────────────────────────────
    CraftVillageDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Làng gốm Bát Tràng
        product:
          type: string
          example: Đồ gốm sứ mỹ nghệ
        address:
          type: string
          example: Xã Bát Tràng, Huyện Gia Lâm, Hà Nội
        certificateNumber:
          type: string
          example: LN-HN-001
        recognitionDate:
          type: string
          format: date
          example: "2010-05-20"
        imageUrls:
          type: string
          description: JSON array lưu đường dẫn ảnh
          example: '["/uploads/img1.jpg"]'

    # ── Trademark ───────────────────────────────
    TrademarkDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        trademarkSample:
          type: string
          example: Logo chữ VINAMILK màu xanh dương
        name:
          type: string
          example: VINAMILK
        type:
          type: string
          example: Nhãn hiệu hàng hóa
        applicationNumber:
          type: string
          example: 4-2024-10001
        applicationDate:
          type: string
          format: date
        publicationNumber:
          type: string
          example: PB-2024-10001
        publicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: NH-2024-10001
        grantDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        productServiceGroup:
          type: string
          example: Nhóm 29 - Sữa và các sản phẩm từ sữa
        classification:
          type: string
          example: Nhóm 29
        status:
          type: string
          example: Đã cấp văn bằng
        ownerId:
          type: integer
          format: int64
          nullable: true
          example: 1714200000002
        imageUrls:
          type: string
          description: JSON array lưu đường dẫn ảnh
        owner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StakeholderObject'

    # ── Geographical Indication ──────────────────
    GeographicalIndicationDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Nước mắm Phú Quốc
        product:
          type: string
          example: Nước mắm
        applicationNumber:
          type: string
          example: CDDL-2024-001
        applicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: CDDL-PQ-001
        grantDate:
          type: string
          format: date
        geographicalArea:
          type: string
          example: Đảo Phú Quốc, tỉnh Kiên Giang
        description:
          type: string
          example: Nước mắm truyền thống sản xuất tại đảo Phú Quốc
        status:
          type: string
          example: Đã đăng ký
        ownerId:
          type: integer
          format: int64
          nullable: true
        managementOrgId:
          type: integer
          format: int64
          nullable: true
        imageUrls:
          type: string
          description: JSON array lưu đường dẫn ảnh
        owner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StakeholderObject'
        managementOrg:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StakeholderObject'

    # ── Invention ───────────────────────────────
    InventionDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Hệ thống thu hồi năng lượng mặt trời hiệu suất cao
        applicationNumber:
          type: string
          example: 1-2024-05001
        applicationDate:
          type: string
          format: date
        publicationNumber:
          type: string
          example: PB-SC-2024-05001
        publicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: SC-2024-05001
        grantDate:
          type: string
          format: date
        ipcClassification:
          type: string
          example: H02S 40/00
        status:
          type: string
          example: Đã cấp bằng độc quyền sáng chế
        ownerId:
          type: integer
          format: int64
          nullable: true
        imageUrls:
          type: string
          description: JSON array lưu đường dẫn ảnh
        owner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StakeholderObject'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/StakeholderObject'

    # ── Industrial Design ────────────────────────
    IndustrialDesignDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Kiểu dáng chai nước giải khát hình sóng biển
        applicationNumber:
          type: string
          example: 2-2024-20001
        applicationDate:
          type: string
          format: date
        publicationNumber:
          type: string
          example: PB-KD-2024-20001
        publicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: KD-2024-20001
        grantDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        locarnoClassification:
          type: string
          example: 09-01
        status:
          type: string
          example: Đã cấp bằng độc quyền kiểu dáng
        ownerId:
          type: integer
          format: int64
          nullable: true
        imageUrls:
          type: string
          description: JSON array lưu đường dẫn ảnh
        owner:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StakeholderObject'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/StakeholderObject'

    # ── Row schemas (list / search — không có quan hệ lồng nhau) ─
    CopyrightRow:
      type: object
      description: Hàng dữ liệu thô từ bảng copyrights, không có authors/owners lồng nhau
      properties:
        id:
          type: integer
          format: int64
        certificateNumber:
          type: string
          example: BQ-2024-001
        grantDate:
          type: string
          format: date
          example: "2024-01-15"
        title:
          type: string
          example: Phần mềm quản lý nhà hàng
        type:
          type: string
          example: software
        imageUrls:
          type: string
          description: JSON array string chứa đường dẫn ảnh
          example: '["/uploads/img1.jpg"]'

    TrademarkRow:
      type: object
      description: Hàng dữ liệu thô từ bảng trademarks, chứa ownerId thay vì object owner
      properties:
        id:
          type: integer
          format: int64
        trademarkSample:
          type: string
          example: Logo chữ VINAMILK màu xanh dương
        name:
          type: string
          example: VINAMILK
        type:
          type: string
          example: Nhãn hiệu hàng hóa
        applicationNumber:
          type: string
          example: 4-2024-10001
        applicationDate:
          type: string
          format: date
        publicationNumber:
          type: string
        publicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: NH-2024-10001
        grantDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        productServiceGroup:
          type: string
          example: Nhóm 29 - Sữa và các sản phẩm từ sữa
        classification:
          type: string
          example: Nhóm 29
        status:
          type: string
          example: Đã cấp văn bằng
        ownerId:
          type: integer
          format: int64
          nullable: true
          example: 1714200000002
        imageUrls:
          type: string
          description: JSON array string chứa đường dẫn ảnh

    GeographicalIndicationRow:
      type: object
      description: Hàng dữ liệu thô từ bảng geographicalIndications, chứa ownerId/managementOrgId
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Nước mắm Phú Quốc
        product:
          type: string
          example: Nước mắm
        applicationNumber:
          type: string
          example: CDDL-2024-001
        applicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: CDDL-PQ-001
        grantDate:
          type: string
          format: date
        geographicalArea:
          type: string
          example: Đảo Phú Quốc, tỉnh Kiên Giang
        description:
          type: string
        status:
          type: string
          example: Đã đăng ký
        ownerId:
          type: integer
          format: int64
          nullable: true
        managementOrgId:
          type: integer
          format: int64
          nullable: true
        imageUrls:
          type: string
          description: JSON array string chứa đường dẫn ảnh

    InventionRow:
      type: object
      description: Hàng dữ liệu thô từ bảng inventions, chứa ownerId, không có authors array
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Hệ thống thu hồi năng lượng mặt trời hiệu suất cao
        applicationNumber:
          type: string
          example: 1-2024-05001
        applicationDate:
          type: string
          format: date
        publicationNumber:
          type: string
        publicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: SC-2024-05001
        grantDate:
          type: string
          format: date
        ipcClassification:
          type: string
          example: H02S 40/00
        status:
          type: string
          example: Đã cấp bằng độc quyền sáng chế
        ownerId:
          type: integer
          format: int64
          nullable: true
        imageUrls:
          type: string
          description: JSON array string chứa đường dẫn ảnh

    IndustrialDesignRow:
      type: object
      description: Hàng dữ liệu thô từ bảng industrialDesigns, chứa ownerId, không có authors array
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: Kiểu dáng chai nước giải khát hình sóng biển
        applicationNumber:
          type: string
          example: 2-2024-20001
        applicationDate:
          type: string
          format: date
        publicationNumber:
          type: string
        publicationDate:
          type: string
          format: date
        certificateNumber:
          type: string
          example: KD-2024-20001
        grantDate:
          type: string
          format: date
        expirationDate:
          type: string
          format: date
        locarnoClassification:
          type: string
          example: 09-01
        status:
          type: string
          example: Đã cấp bằng độc quyền kiểu dáng
        ownerId:
          type: integer
          format: int64
          nullable: true
        imageUrls:
          type: string
          description: JSON array string chứa đường dẫn ảnh

  # ── Reusable responses ──────────────────────
  responses:
    Unauthorized:
      description: Chưa xác thực — thiếu token (Authorization header không có)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Unauthorized
    Forbidden:
      description: Không đủ quyền — token không hợp lệ/hết hạn, hoặc sai role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Forbidden
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Không tìm thấy
    ServerError:
      description: Lỗi server nội bộ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: Lỗi server
            error: Error detail

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ════════════════════════════════
  # HEALTH
  # ════════════════════════════════
  /:
    get:
      tags: [Health]
      summary: Welcome message
      operationId: getWelcome
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Welcome to Express API

  /api/health:
    get:
      tags: [Health]
      summary: Kiểm tra trạng thái server
      operationId: healthCheck
      responses:
        '200':
          description: Server đang hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: OK
                  timestamp:
                    type: string
                    format: date-time

  # ════════════════════════════════
  # AUTH
  # ════════════════════════════════
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập
      operationId: login
      description: |
        Trả về `accessToken` (hết hạn sau 15 phút) và `refreshToken` (7 ngày).
        Trường `user` trong response chỉ gồm `id`, `username`, `role` (không có `fullName`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: Test@123
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Đăng nhập thành công
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/UserLoginObject'
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9...
                      refreshToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9...
        '400':
          description: Thiếu username hoặc password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Vui lòng cung cấp username và password
        '401':
          description: Sai username hoặc mật khẩu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: username hoặc mật khẩu không đúng
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/refresh-token:
    post:
      tags: [Auth]
      summary: Làm mới Access Token
      operationId: refreshToken
      description: |
        Dùng `refreshToken` để lấy `accessToken` mới mà không cần đăng nhập lại.

        - `401` — Không có refreshToken trong body
        - `403` — RefreshToken không hợp lệ/hết hạn, hoặc user không còn tồn tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  example: eyJhbGciOiJIUzI1NiJ9...
      responses:
        '200':
          description: Cấp token mới thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                        example: eyJhbGciOiJIUzI1NiJ9...
        '401':
          description: Không có refreshToken trong body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Không tìm thấy Refresh Token
        '403':
          description: RefreshToken không hợp lệ hoặc đã hết hạn
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Refresh Token không hợp lệ hoặc đã hết hạn
        '500':
          $ref: '#/components/responses/ServerError'

  # ════════════════════════════════
  # USERS
  # ════════════════════════════════
  /api/users:
    get:
      tags: [Users]
      summary: Lấy danh sách tất cả tài khoản
      operationId: getAllUsers
      security:
        - bearerAuth: []
      description: Chỉ Admin được phép. Trả về 404 nếu chưa có tài khoản nào.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserObject'
        '401':
