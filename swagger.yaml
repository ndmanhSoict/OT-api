      parameters:
        - name: name
          in: query
          schema:
            type: string
          description: Tên nhãn hiệu
          example: Vinamilk
        - name: trademarkSample
          in: query
          schema:
            type: string
          description: Mẫu nhãn hiệu
        - name: type
          in: query
          schema:
            type: string
          description: Loại nhãn hiệu
          example: Nhãn hiệu hàng hóa
        - name: applicationNumber
          in: query
          schema:
            type: string
          description: Số đơn
          example: 4-2024-10001
        - name: publicationNumber
          in: query
          schema:
            type: string
          description: Số công bố
        - name: certificateNumber
          in: query
          schema:
            type: string
          description: Số văn bằng
          example: NH-2024-10001
        - name: productServiceGroup
          in: query
          schema:
            type: string
          description: Nhóm sản phẩm/dịch vụ
        - name: classification
          in: query
          schema:
            type: string
          description: Phân nhóm
          example: Nhóm 29
        - name: status
          in: query
          schema:
            type: string
          description: Trạng thái
          example: Đã cấp văn bằng
        - name: applicationDate
          in: query
          schema:
            type: string
          description: Ngày nộp đơn (tìm theo chuỗi)
          example: "2024"
        - name: publicationDate
          in: query
          schema:
            type: string
          description: Ngày công bố (tìm theo chuỗi)
        - name: grantDate
          in: query
          schema:
            type: string
          description: Ngày cấp (tìm theo chuỗi)
        - name: expirationDate
          in: query
          schema:
            type: string
          description: Ngày hết hạn (tìm theo chuỗi)
      responses:
        '200':
          description: Kết quả tìm kiếm
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
