  # ════════════════════════════════
  # COPYRIGHTS
  # ════════════════════════════════
  /api/copyrights/search:
    get:
      tags: [Copyrights]
      summary: Tìm kiếm bản quyền
      operationId: searchCopyrights
      description: |
        Tìm kiếm theo từng trường. Truyền một hoặc nhiều tham số — nhiều tham số sẽ được kết hợp bằng **AND** (bản ghi phải thỏa mãn tất cả điều kiện).
        Kết quả không bao gồm danh sách authors/owners — dùng GET /:id để lấy đầy đủ.

        **Ví dụ:**
        - Tìm 1 trường: `?title=phần mềm`
        - Tìm nhiều trường: `?type=software&grantDate=2024`
      parameters:
        - name: certificateNumber
          in: query
          schema:
            type: string
          description: Số chứng nhận
          example: BQ-2024-001
        - name: title
          in: query
          schema:
            type: string
          description: Tên tác phẩm
          example: phần mềm
        - name: type
          in: query
          schema:
            type: string
          description: Loại bản quyền
          example: software
        - name: grantDate
          in: query
          schema:
            type: string
          description: Ngày cấp (tìm theo chuỗi, ví dụ năm hoặc ngày đầy đủ)
          example: "2024"
      responses:
        '200':
          description: Kết quả tìm kiếm
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CopyrightRow'
        '400':
          description: Không truyền tham số tìm kiếm nào
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "Cần truyền ít nhất một trường tìm kiếm. Các trường hợp lệ: certificateNumber, title, type, grantDate"
        '500':
          $ref: '#/components/responses/ServerError'

  /api/copyrights/search-all:
    get:
      tags: [Copyrights]
      summary: Tìm kiếm bản quyền tổng hợp (Admin/Staff)
      operationId: searchAllCopyrights
      security:
        - bearerAuth: []
      description: |
        Tìm kiếm **OR** trên tất cả các trường: `certificateNumber`, `title`, `type`, `grantDate`.
        Chỉ dành cho Admin và Staff. Kết quả không bao gồm authors/owners — dùng GET /:id để lấy đầy đủ.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Từ khóa tìm kiếm (khớp với bất kỳ trường nào)
          example: phần mềm
      responses:
        '200':
          description: Kết quả tìm kiếm
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CopyrightRow'
        '400':
          description: Thiếu tham số q
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: Cần truyền tham số q
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/copyrights:
    get:
      tags: [Copyrights]
      summary: Lấy danh sách tất cả bản quyền
      operationId: getAllCopyrights
      description: Trả về danh sách thô, không có authors/owners lồng nhau. Dùng GET /:id để lấy đầy đủ.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CopyrightRow'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Copyrights]
      summary: Tạo bản quyền mới
      operationId: createCopyright
      security:
        - bearerAuth: []
      description: |
        Yêu cầu Admin hoặc Staff. Sử dụng `multipart/form-data`.
        Trường `authors` và `owners` truyền dưới dạng **JSON array string**.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                certificateNumber:
                  type: string
                  example: BQ-2024-001
                grantDate:
                  type: string
                  format: date
                  example: "2024-01-15"
                title:
                  type: string
                  example: Phần mềm quản lý nhà hàng
                type:
                  type: string
                  example: software
                authors:
                  type: string
                  description: 'JSON array — [{"name":"...","address":"..."}]'
                  example: '[{"name":"Nguyễn Văn A","address":"123 Lê Lợi, Hà Nội"}]'
                owners:
                  type: string
                  description: 'JSON array — [{"name":"...","address":"..."}]'
                  example: '[{"name":"Công ty TNHH ABC Tech","address":"789 Nguyễn Huệ, TP.HCM"}]'
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: File ảnh, tối đa 5 file
      responses:
        '201':
          description: Tạo thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessWithId'
              example:
                success: true
                message: Tạo bản quyền thành công
                id: 1714200000000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/copyrights/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1714200000000
    get:
      tags: [Copyrights]
      summary: Xem chi tiết bản quyền
      operationId: getCopyrightById
      description: |
        Trả về bản quyền kèm danh sách `authors` và `owners`.
        Lưu ý: mỗi phần tử trong `authors`/`owners` có trường `role` (author/owner) từ bảng liên kết,
        nhưng không có trường `id`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CopyrightDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Copyrights]
      summary: Cập nhật bản quyền
      operationId: updateCopyright
      security:
        - bearerAuth: []
      description: |
        Yêu cầu Admin hoặc Staff. Sử dụng `multipart/form-data`.
        Danh sách authors/owners sẽ được thay thế hoàn toàn.

        **Xử lý ảnh:** Truyền `existingImages` là JSON array các URL ảnh cũ muốn **giữ lại**.
        Ảnh cũ không có trong danh sách sẽ bị xóa khỏi server. Thêm file mới qua `images`.
        Nếu không truyền `existingImages`, toàn bộ ảnh cũ được giữ nguyên.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                certificateNumber:
                  type: string
                grantDate:
                  type: string
                  format: date
                title:
                  type: string
                type:
                  type: string
                authors:
                  type: string
                  description: 'JSON array string — [{"name":"...","address":"..."}]'
                owners:
                  type: string
                  description: 'JSON array string — [{"name":"...","address":"..."}]'
                existingImages:
                  type: string
                  description: 'JSON array URL ảnh cũ cần giữ lại — ["/uploads/img1.jpg"]'
                  example: '["/uploads/1714200000000-123.jpg"]'
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: File ảnh mới cần thêm vào
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: Cập nhật thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Copyrights]
      summary: Xóa bản quyền
      operationId: deleteCopyright
      security:
        - bearerAuth: []
      description: Yêu cầu Admin hoặc Staff. Xóa cascade xuống bảng copyrightAuthors.
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: Đã xóa bản quyền thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

