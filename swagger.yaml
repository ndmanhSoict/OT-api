  /api/industrial-designs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 1714200000000
    get:
      tags: [Industrial Designs]
      summary: Xem chi tiết kiểu dáng công nghiệp
      operationId: getIndustrialDesignById
      description: |
        Trả về kiểu dáng kèm `owner` (object lồng nhau) và mảng `authors` (mỗi phần tử có `id`, `name`, `address`).
        Response cũng giữ lại trường `ownerId`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/IndustrialDesignDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [Industrial Designs]
      summary: Cập nhật kiểu dáng công nghiệp
      operationId: updateIndustrialDesign
      security:
        - bearerAuth: []
      description: |
        Yêu cầu Admin hoặc Staff. Sử dụng `multipart/form-data`.
        Danh sách `authors` sẽ được thay thế hoàn toàn. Nếu không truyền `owner`, ownerId sẽ được set về null.

        **Xử lý ảnh:** Truyền `existingImages` là JSON array các URL ảnh cũ muốn **giữ lại**.
        Ảnh cũ không có trong danh sách sẽ bị xóa khỏi server. Thêm file mới qua `images`.
        Nếu không truyền `existingImages`, toàn bộ ảnh cũ được giữ nguyên.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                applicationNumber:
                  type: string
                applicationDate:
                  type: string
                  format: date
                publicationNumber:
                  type: string
                publicationDate:
                  type: string
                  format: date
                certificateNumber:
                  type: string
                grantDate:
                  type: string
                  format: date
                expirationDate:
                  type: string
                  format: date
                locarnoClassification:
                  type: string
                status:
                  type: string
                owner:
                  type: string
                  description: 'JSON object string — {"name":"...","address":"..."}'
                authors:
                  type: string
                  description: 'JSON array string — [{"name":"...","address":"..."}]'
                existingImages:
                  type: string
                  description: 'JSON array URL ảnh cũ cần giữ lại — ["/uploads/img1.jpg"]'
                  example: '["/uploads/1714200000000-123.jpg"]'
                images:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: File ảnh mới cần thêm vào
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: Cập nhật kiểu dáng công nghiệp thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Industrial Designs]
      summary: Xóa kiểu dáng công nghiệp
      operationId: deleteIndustrialDesign
      security:
        - bearerAuth: []
      description: Yêu cầu Admin hoặc Staff.
      responses:
        '200':
          description: Xóa thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
              example:
                success: true
                message: Đã xóa kiểu dáng công nghiệp thành công
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
