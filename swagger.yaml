              example:
                success: false
                message: "Cần truyền ít nhất một trường tìm kiếm. Các trường hợp lệ: trademarkSample, name, type, applicationNumber, publicationNumber, certificateNumber, productServiceGroup, classification, status, applicationDate, publicationDate, grantDate, expirationDate"
